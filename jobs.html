const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
// Older phones lack DecompressionStream: fall back to pako from cdnjs.
const loadPako=()=>new Promise((ok,bad)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js';s.onload=ok;s.onerror=bad;document.head.appendChild(s);});
async function gunzip(buf){
  if(typeof DecompressionStream!=='undefined'){return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();}
  if(!window.pako)await loadPako();
  return pako.ungzip(new Uint8Array(buf),{to:'string'});
}
async function open_(pw){
  if(!window.crypto||!crypto.subtle)throw new Error('browser');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  let plain;
  try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IV)},key,u8(DATA));}catch(e){throw new Error('password');}
  let html;
  try{html=await gunzip(plain);}catch(e){throw new Error('browser');}
  document.open();document.write(html);document.close();
}
const saved=(()=>{try{return localStorage.getItem(KEY)}catch(e){return null}})();
if(saved) open_(saved).catch(()=>{try{localStorage.removeItem(KEY)}catch(e){}});
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('err'),go=document.getElementById('go'),pw=document.getElementById('pw').value.trim(),rem=document.getElementById('rem').checked;
  err.textContent='';go.disabled=true;go.textContent='Opening…';
  try{await open_(pw);try{if(rem)localStorage.setItem(KEY,pw)}catch(x){}}
  catch(x){err.textContent=x.message==='browser'?'This browser cannot open the page. Try Chrome or Safari, updated.':'Wrong password. Check capital letters (O, D, E) and no extra spaces.';go.disabled=false;go.textContent='Open';}});
