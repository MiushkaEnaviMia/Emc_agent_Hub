<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>My tools</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--fg:#1f2a3a;--muted:#5b6778;--brand:#0d7480;--line:#d6dde7;--bad:#b3412f}
@media (prefers-color-scheme:dark){:root{--bg:#141922;--card:#1d2430;--fg:#e8edf4;--muted:#a3afc0;--brand:#4fbcc7;--line:#344052;--bad:#f08a78}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px 16px}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:22px;color:var(--brand)}p{margin:0;color:var(--muted);font-size:14px}label{font-size:14px;color:var(--muted)}
input[type=password]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--fg)}
button{font:inherit;font-weight:700;padding:10px 12px;border:0;border-radius:10px;background:var(--brand);color:#fff;cursor:pointer}
#err{color:var(--bad);min-height:1.5em}
</style></head><body>
<form id="f"><h1>My tools</h1><p>Enter the password to open.</p>
<input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus>
<label><input id="rem" type="checkbox" checked> Remember on this device</label>
<button id="go" type="submit">Open</button><p id="err"></p></form>

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IV)},key,u8(DATA));
  const html=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open();document.write(html);document.close();
}
const saved=(()=>{try{return localStorage.getItem(KEY)}catch(e){return null}})();

document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('err'),go=document.getElementById('go'),pw=document.getElementById('pw').value,rem=document.getElementById('rem').checked;

  try{await open_(pw);try{if(rem)localStorage.setItem(KEY,pw)}catch(x){}}
